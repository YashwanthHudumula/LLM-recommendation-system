name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
      - run: uv sync --extra dev --locked
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest --cov=recllm_fairness --cov-report=term-missing


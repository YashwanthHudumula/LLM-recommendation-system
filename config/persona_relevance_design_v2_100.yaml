schema_version: 2
design_version: persona-relevance-v2-100
status: frozen
frozen_date: "2026-08-03"
created_date: "2026-08-03"
target_personas_per_domain: 100
source_datasets:
  movie:
    name: MovieLens
    version: 25m
  music:
    name: LastFM
    version: 360k
population_construction:
  seed: 20260731
  sample_without_replacement: true
  raw_user_ids_allowed_in_prompts: false
  raw_user_ids_allowed_in_public_outputs: false
  construction_and_evaluation_sets_disjoint: true
  minimum_held_out_relevant_items: 30
  stratification_dimensions:
    - activity
    - popularity_tendency
    - genre_or_listening_diversity
  movie:
    positive_rating_threshold: 4.0
    minimum_activity: 60
    construction_fraction: 0.5
    strata_boundaries:
      activity: [91.0, 156.0]
      popularity_tendency: [0.01215783762737884, 0.019984080478263073]
      diversity: [2.418376425262882, 2.516687525379724]
    preference_template_grammar: "I enjoy films in genres such as {natural_join(top_3_construction_genres)}, especially titles from {natural_join(the_top_2_construction_decades)}."
  music:
    minimum_distinct_artists: 60
    construction_fraction: 0.5
    strata_boundaries:
      activity: [62.0, 67.0]
      popularity_tendency: [0.023321122709700607, 0.04267827807604872]
      diversity: [3.854398919904295, 4.003426963709502]
    preference_template_grammar: "I often listen to artists such as {natural_join(top_5_construction_artists_by_plays)}{terminal_punctuation_unless_present}"
freeze_requirements:
  feasibility_diagnostics_complete: true
  exactly_100_unique_profiles_per_domain: true
  leakage_audit_passed: true
  duplicate_profile_audit_passed: true
  candidate_opportunity_audit_passed: true
  human_wording_review_passed: true
  semantic_phrasing_gate_passed: true
  semantic_phrasing_gate:
    model: sentence-transformers/all-MiniLM-L6-v2
    threshold: 0.82
    movie_minimum_cosine: 0.8833701246
    music_minimum_cosine: 0.9032811861
    audit: data/audits/semantic_phrasing_v2_100.json
candidate_pools:
  size: 120
  tier_allocation: {head: 60, mid: 30, tail: 30}
  minimum_relevant_opportunity: 30
  seed_namespace: candidate-pool
  movie_artifact: data/relevance_labels/candidate_pools_movies_full_v2_100_frozen.json
  music_artifact: data/relevance_labels/candidate_pools_music_full_v2_100_frozen.json
sampling_plan:
  status: frozen
  path: docs/SAMPLING_PLAN_V2_100.md
  note: All requirements must pass before status may change to frozen.

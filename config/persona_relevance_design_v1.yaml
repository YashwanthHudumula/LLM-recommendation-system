movie_preferences:
  - id: M1
    text: I enjoy science fiction movies that explore future technology and space.
    genre_rule:
      any_of: [Sci-Fi]
  - id: M2
    text: I like romantic comedies with lighthearted, feel-good storylines.
    genre_rule:
      all_of: [Romance, Comedy]
  - id: M3
    text: I'm drawn to war dramas that portray historical conflicts.
    genre_rule:
      all_of: [War, Drama]
  - id: M4
    text: I enjoy classic film noir and crime mysteries with morally ambiguous characters.
    genre_rule:
      any_of: [Film-Noir, Crime, Mystery]
  - id: M5
    text: I like animated family films.
    genre_rule:
      all_of: [Animation, "Children's"]
  - id: M6
    text: I enjoy horror and thriller movies that build suspense.
    genre_rule:
      any_of: [Horror, Thriller]
music_preferences:
  - id: S1
    text: I love atmospheric, experimental artists like Radiohead and Björk.
    seed_artists: [Radiohead, Björk]
  - id: S2
    text: I'm into classic hip-hop, artists like Nas and Wu-Tang Clan.
    seed_artists: [Nas, Wu-Tang Clan]
  - id: S3
    text: I listen to a lot of electronic and dance music, like Daft Punk and Aphex Twin.
    seed_artists: [Daft Punk, Aphex Twin]
  - id: S4
    text: I enjoy singer-songwriter folk, artists like Bon Iver and Fleet Foxes.
    seed_artists: [Bon Iver, Fleet Foxes]
  - id: S5
    text: I'm a fan of heavier rock and metal, bands like Metallica and Tool.
    seed_artists: [Metallica, Tool]
  - id: S6
    text: I like classic soul and R&B, artists like Stevie Wonder and Aretha Franklin.
    seed_artists: [Stevie Wonder, Aretha Franklin]
